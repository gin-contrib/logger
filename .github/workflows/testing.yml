name: Lint and Testing

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    strategy:
      matrix:
        go: ["1.26", "1.27"]
    runs-on: ubuntu-latest
    name: lint @ Go ${{ matrix.go }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: |
            go.sum
            go.tools.sum
      - name: Run lint
        run: make install-tools lint

      - name: Install Bearer
        env:
          GH_TOKEN: ${{ github.token }}
          BEARER_VERSION: "2.1.3"
          BEARER_RULES_VERSION: "0.48.4"
        run: |
          install_dir=$(mktemp -d "$RUNNER_TEMP/bearer.XXXXXX")
          archive="bearer_${BEARER_VERSION}_linux_amd64.tar.gz"
          for attempt in 1 2 3; do
            if gh release download "v${BEARER_VERSION}" --repo Bearer/bearer \
              --pattern "$archive" --pattern checksums.txt --dir "$install_dir" --clobber; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 5
          done
          cd "$install_dir"
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf "$archive" bearer
          echo "$install_dir" >> "$GITHUB_PATH"
          rules_dir="$install_dir/rules"
          mkdir "$rules_dir"
          for attempt in 1 2 3; do
            if gh release download "v${BEARER_RULES_VERSION}" --repo Bearer/bearer-rules \
              --pattern '*.tar.gz' --dir "$rules_dir" --clobber; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 5
          done
          for package in "$rules_dir"/*.tar.gz; do
            tar -xzf "$package" -C "$rules_dir"
          done
          echo "BEARER_EXTERNAL_RULE_DIR=$rules_dir" >> "$GITHUB_ENV"

      - name: Bearer
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CURRENT_BRANCH: ${{ github.head_ref }}
          DIFF_BASE_BRANCH: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEARER_HIDE_PROGRESS_BAR: "true"
        # Load the complete pinned rule release without the failing web downloads.
        run: bearer scan --disable-default-rules --disable-version-check .

  test:
    strategy:
      matrix:
        os: [ubuntu-latest]
        go: ["1.26", "1.27"]
        include:
          - os: ubuntu-latest
            go-build: ~/.cache/go-build
    name: ${{ matrix.os }} @ Go ${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    env:
      GO111MODULE: on
      GOPROXY: https://proxy.golang.org
    steps:
      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: actions/cache@v6
        with:
          path: |
            ${{ matrix.go-build }}
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Run Tests
        run: make test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.txt
          flags: ${{ matrix.os }},go-${{ matrix.go }}
